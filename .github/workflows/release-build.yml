name: Build verified release
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      game_commit:
        required: true
        type: string
      reuse_candidate:
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
  pull-requests: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  IRONMON_RUNTIME_TRACE: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: infinitefusion/infinitefusion-hoenn-public
          ref: ${{ inputs.game_commit }}
          path: game
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          path: game/Ironmon
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-inputs
          path: upstream-inputs
      - name: Reuse reviewed candidate if source and current inputs match
        if: inputs.reuse_candidate
        id: reuse
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./game/Ironmon/tools/ci/Reuse-ReleaseCandidate.ps1 -SnapshotDirectory (Join-Path $env:GITHUB_WORKSPACE 'upstream-inputs')
      - name: Install refreshed metadata and software rendering
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: ./game/Ironmon/tools/ci/Initialize-HostedGame.ps1 -SnapshotDirectory upstream-inputs
      - name: Verify clean runtime startup
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: ./game/Ironmon/tools/ci/Test-HostedGameRuntime.ps1
      - name: Reuse or generate catalogs for these exact inputs
        if: steps.reuse.outputs.reused != 'true'
        id: catalogs
        uses: ./game/Ironmon/.github/actions/generated-catalogs
        with:
          project-root: game/Ironmon
          snapshot-directory: upstream-inputs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: steps.reuse.outputs.reused != 'true'
        with:
          dotnet-version: 10.0.400
      - name: Install Windows MAUI workload
        if: steps.reuse.outputs.reused != 'true'
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Run the release tests once and package both variants
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        working-directory: game/Ironmon
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Build-TrackerRelease.ps1 -GenerationCacheDirectory (Join-Path $PWD 'data/ci/generated-cache') *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'release-gate.log')
      - name: Audit fusion membership changes against the previous stable release
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        working-directory: game/Ironmon
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/Compare-ReleasePool.ps1
      - name: Freeze candidate and evidence
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        working-directory: game/Ironmon
        run: ./tools/ci/New-ReleaseCandidate.ps1 -SnapshotDirectory (Join-Path $env:GITHUB_WORKSPACE 'upstream-inputs')
      - name: Restore the approved candidate's generated catalogs
        if: steps.reuse.outputs.reused == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-catalogs
          path: game/Ironmon/data/ci/generated-cache
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify approved catalogs before retaining them on main
        if: steps.reuse.outputs.reused == 'true'
        id: approved-catalogs
        shell: pwsh
        run: ./game/Ironmon/tools/ci/Approve-GenerationCache.ps1 -SnapshotDirectory upstream-inputs
      - name: Share approved catalogs with later PRs
        if: steps.reuse.outputs.reused == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.approved-catalogs.outputs.directory }}
          key: ${{ steps.approved-catalogs.outputs.key }}
      - name: Retain generated catalogs with candidate provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-catalogs
          path: game/Ironmon/data/ci/generated-cache
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: game/Ironmon/release/
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-failure-diagnostics
          path: |
            game/Ironmon/data/*.error
            game/Ironmon/data/*.summary
            game/Ironmon/data/*.progress
            game/Ironmon/data/*.txt
            game/errorlog.txt
            ${{ runner.temp }}/ironmon-runtime.*.log
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore
