name: Refresh sprite download estimates
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprite-size-estimates
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'Nobbinobb/infinitefusion-hoenn-ironmon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Measure the published release's pinned sprite sheets
        shell: pwsh
        env:
          IRONMON_SPRITE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run --project tracker/tools/Ironmon.SpriteSizeTool -c Release -p:UpdaterMetadataOnly=true -- latest estimates.json "$env:RUNNER_TEMP/sprite-release-discovery"
          if ($LASTEXITCODE -ne 0) { throw 'Sprite measurement failed; the published estimate is unchanged.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sprite-size-estimates
          path: estimates.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sprite-size-estimates
          path: sprite-estimate-data
      - name: Update only the dedicated public estimate branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/Publish-SpriteDownloadEstimates.ps1 -Path sprite-estimate-data/estimates.json
