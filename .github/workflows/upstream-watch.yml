name: Check upstream updates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Retest open PRs only when upstream inputs change
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/Refresh-UpstreamValidation.ps1
