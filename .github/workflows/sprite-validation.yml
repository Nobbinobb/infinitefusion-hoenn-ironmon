name: Validate custom sprite catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprite-validation
  cancel-in-progress: false

jobs:
  inputs:
    uses: ./.github/workflows/upstream-inputs.yml

  validate:
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-inputs
          path: upstream-inputs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sprite-validation-cache.json
          key: sprite-validation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sprite-validation-v1-
      - name: Install the image decoder
        run: python3 -m pip install -r tools/sprites/requirements.txt
      - name: Verify the validator with small image fixtures
        run: python3 -m unittest discover -s tools/sprites -p 'test_*.py'
      - name: Validate all permitted variants and conditionally refresh changed sheets
        run: >-
          python3 tools/sprites/validate_catalog.py
          --index upstream-inputs/CUSTOM_SPRITES
          --credits upstream-inputs/Sprite_Credits.csv
          --cache sprite-validation-cache.json
          --output sprite-validation/validated_custom_sprites.json.gz
      - name: Publish the complete catalogue for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-custom-sprites-${{ github.run_id }}
          path: sprite-validation/
          retention-days: 90
          if-no-files-found: error
