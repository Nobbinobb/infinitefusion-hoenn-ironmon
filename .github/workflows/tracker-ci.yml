name: Tracker CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      profile:
        description: Quick C# and Ruby checks, or full C# coverage with Ruby smoke checks
        type: choice
        options: [Quick, Full]
        default: Quick

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: tracker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  IRONMON_RUNTIME_TRACE: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate mod, tracker and release-note versions
        id: version
        shell: pwsh
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          . ./tools/ci/UpstreamInputs.ps1
          if ($env:BASE_COMMIT) { Assert-IronmonReleaseMetadata -BaseCommit $env:BASE_COMMIT } else { Assert-IronmonReleaseMetadata; 'release=false' >> $env:GITHUB_OUTPUT }
  validation:
    name: PR validation
    if: always()
    needs: [metadata, inputs, current-catalogs, sprite-contracts, quick-core, quick-desktop, ruby-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected validation path to pass
        env:
          METADATA: ${{ needs.metadata.result }}
          INPUTS: ${{ needs.inputs.result }}
          SPRITES: ${{ needs.sprite-contracts.result }}
          PROFILE: ${{ inputs.profile || 'Quick' }}
          QUICK_CORE: ${{ needs.quick-core.result }}
          QUICK_DESKTOP: ${{ needs.quick-desktop.result }}
          RUBY: ${{ needs.ruby-smoke.result }}
          FULL: ${{ needs.current-catalogs.result }}
        run: |
          test "$METADATA,$INPUTS,$SPRITES" = 'success,success,success'
          if [ "$PROFILE" = Full ]; then
            test "$FULL" = success
          else
            test "$QUICK_CORE,$QUICK_DESKTOP,$RUBY" = 'success,success,success'
          fi

  sprite-contracts:
    name: Offline sprite catalogue tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m pip install -r tools/sprites/requirements.txt
      - run: python3 -m unittest discover -s tools/sprites -p 'test_*.py'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build sprite measurement tool without generated installer data
        run: dotnet build tracker/tools/Ironmon.SpriteSizeTool -c Release -p:UpdaterMetadataOnly=true

  inputs:
    needs: metadata
    uses: ./.github/workflows/upstream-inputs.yml

  quick-core:
    name: Core and updater smoke tests
    if: inputs.profile != 'Full'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Core Quick tests
        run: dotnet test tracker/tests/Ironmon.Tracker.Tests/Ironmon.Tracker.Tests.csproj -c Release --settings tracker/tests/Quick.runsettings --filter Category!=BundledRuby --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false -p:IronmonQuickTests=true
      - name: Updater Quick tests
        run: dotnet test tracker/tests/Ironmon.Updater.Tests/Ironmon.Updater.Tests.csproj -c Release --settings tracker/tests/Quick.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false -p:IronmonQuickTests=true

  quick-desktop:
    name: Desktop smoke tests
    if: inputs.profile != 'Full'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: App Quick tests
        run: dotnet test tracker/tests/Ironmon.Tracker.App.Tests/Ironmon.Tracker.App.Tests.csproj -c Release --settings tracker/tests/Quick.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false -p:IronmonQuickTests=true
      - name: Overlay Quick tests
        run: dotnet test tracker/tests/Ironmon.Tracker.AchievementOverlay.Tests/Ironmon.Tracker.AchievementOverlay.Tests.csproj -c Release --settings tracker/tests/Quick.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false -p:IronmonQuickTests=true

  ruby-smoke:
    name: Bundled Ruby smoke tests
    needs: inputs
    if: inputs.profile != 'Full'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      IRONMON_TEST_GAME_ROOT: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: runtime-cache
        with:
          path: |
            runtime
            runtime-dependencies
          key: windows-ruby-smoke-v1-${{ needs.inputs.outputs.game_commit }}-mesa26.2.0
      - name: Fetch only the pinned runtime and smoke-test assets
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: infinitefusion/infinitefusion-hoenn-public
          ref: ${{ needs.inputs.outputs.game_commit }}
          path: runtime
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Game.ini
            /InfiniteFusion2.exe
            /*.dll
            /Data/*.dat
            /Data/*.json
            /Data/*.rxdata
            !/Data/Map[0-9]*.rxdata
            /Data/Scripts/
            /Data/sprites/
            /Fonts/
            /Graphics/Windowskins/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-inputs
          path: upstream-inputs
      - name: Apply verified metadata and software rendering
        shell: pwsh
        run: ./source/tools/ci/Initialize-HostedGame.ps1 -SnapshotDirectory upstream-inputs -GameRoot $env:IRONMON_TEST_GAME_ROOT -MesaArchivePath (Join-Path $env:GITHUB_WORKSPACE 'runtime-dependencies/mesa3d.7z')
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: |
            runtime
            runtime-dependencies
          key: windows-ruby-smoke-v1-${{ needs.inputs.outputs.game_commit }}-mesa26.2.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Run the native Ruby entry point through xUnit
        working-directory: source
        run: dotnet test tracker/tests/Ironmon.Tracker.Tests/Ironmon.Tracker.Tests.csproj -c Release --settings tracker/tests/Quick.runsettings --filter Category=BundledRuby --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false -p:IronmonQuickTests=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ruby-smoke-evidence
          path: source/data/ruby-smoke/
          retention-days: 3
          if-no-files-found: ignore

  current-catalogs:
    needs: [metadata, inputs, sprite-contracts]
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'Full'
    name: Full C# validation and Ruby smoke (manual)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Download newest Hoenn release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: infinitefusion/infinitefusion-hoenn-public
          ref: ${{ needs.inputs.outputs.game_commit }}
          path: game
          persist-credentials: false
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: game/Ironmon
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-inputs
          path: upstream-inputs
      - name: Prepare fresh metadata and software rendering for the hosted game
        id: game
        shell: pwsh
        run: ./game/Ironmon/tools/ci/Initialize-HostedGame.ps1 -SnapshotDirectory upstream-inputs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Reuse or generate catalogs for these exact inputs
        uses: ./game/Ironmon/.github/actions/generated-catalogs
        with:
          project-root: game/Ironmon
          snapshot-directory: upstream-inputs
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Provision the pinned Git dependency
        shell: bash
        working-directory: game/Ironmon
        run: curl --create-dirs --fail --location --retry 3 --output tracker/tests/Ironmon.Updater.Tests/bin/test-assets/MinGit.zip https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip
      - name: Core Full tests
        working-directory: game/Ironmon
        run: dotnet test tracker/tests/Ironmon.Tracker.Tests/Ironmon.Tracker.Tests.csproj -c Release --settings tracker/tests/Full.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false
      - name: App Full tests
        working-directory: game/Ironmon
        run: dotnet test tracker/tests/Ironmon.Tracker.App.Tests/Ironmon.Tracker.App.Tests.csproj -c Release --settings tracker/tests/Full.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false
      - name: Updater Full tests
        working-directory: game/Ironmon
        run: dotnet test tracker/tests/Ironmon.Updater.Tests/Ironmon.Updater.Tests.csproj -c Release --settings tracker/tests/Full.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false
      - name: Setup Full tests
        working-directory: game/Ironmon
        run: dotnet test tracker/tests/Ironmon.Setup.Tests/Ironmon.Setup.Tests.csproj -c Release --settings tracker/tests/Full.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false
      - name: Overlay Full tests
        working-directory: game/Ironmon
        run: dotnet test tracker/tests/Ironmon.Tracker.AchievementOverlay.Tests/Ironmon.Tracker.AchievementOverlay.Tests.csproj -c Release --settings tracker/tests/Full.runsettings --maxcpucount:1 -p:UseSharedCompilation=false -p:NuGetAudit=false

  ready:
    name: Release readiness
    if: always()
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require consistent release metadata
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
        run: test "$METADATA_RESULT" = success
